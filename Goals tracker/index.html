<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Goal Tracker</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: 'Georgia', serif;

    /* ===== BACKGROUND — change this one line ===== */
    /* Option A: image link */
    background-image: url('"C:\Users\Windows\Downloads\Backgrnd.jpg"');
    /* Option B: local photo — put photo.jpg in same folder as this file, then use: */
    /* background-image: url('photo.jpg'); */

    background-size: cover;
    background-position: center;
  }

  /* dark overlay so white text stays readable on any photo */
  .overlay {
    height: 100%;
    width: 100%;
    background: rgba(0, 0, 0, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    opacity: 1;
    transition: opacity 0.6s ease;
  }

  .overlay.hide {
    opacity: 0;
    pointer-events: none;
  }

  .greeting {
    color: #FFFFFF;
    font-size: 42px;
    font-weight: 400;
    text-align: center;
  }

  .name {
    color: #FFFFFF;
    font-size: 20px;
    margin-top: 10px;
    opacity: 0.85;
    letter-spacing: 1px;
  }

  #app {
    display: none;
    height: 100vh;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
    color: white;
  }
</style>
</head>
<body>

  <div class="overlay" id="splash">
    <div class="greeting" id="greetingText">Loading...</div>
    <div class="name" id="nameText"></div>
  </div>

  <!-- your real app goes here — hidden until splash finishes -->
  <div id="app">
    <p>Your app content starts here</p>
  </div>

  <script>
    // ===== change this to your name =====
    const userName = "Hariom";

    // pick greeting based on current time
    const hour = new Date().getHours();
    let greeting;
    if (hour < 12) {
      greeting = "Good morning";
    } else if (hour < 17) {
      greeting = "Good afternoon";
    } else {
      greeting = "Good evening";
    }

    document.getElementById("greetingText").textContent = greeting;
    document.getElementById("nameText").textContent = userName;

    // after 5 seconds: fade out splash, show app
    setTimeout(() => {
      const splash = document.getElementById("splash");
      splash.classList.add("hide");

      // wait for fade transition to finish, then fully remove splash + show app
      setTimeout(() => {
        splash.style.display = "none";
        document.getElementById("app").style.display = "flex";
      }, 600);
    }, 5000);
  </script>

</body>
</html>
