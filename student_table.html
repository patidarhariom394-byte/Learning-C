<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Report</title>
    <style>
        /* Optional basic styling to make the table readable */
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 10px;
        }
        thead {
            background-color: #f2f2f2;
        }
        tfoot {
            background-color: #e9e9e9;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- <table>: Defines the main table container -->
    <table>
        
        <!-- <thead>: Groups the header content (column titles) -->
        <thead>
            <!-- <tr>: Defines a table row -->
            <tr>
                <!-- <th>: Defines a header cell (automatically bold and centered by default) -->
                <th>Roll No</th>
                <th>Student Name</th>
                <th>Maths</th>
                <th>Science</th>
                <th>English</th>
                <th>Total Marks</th>
            </tr>
        </thead>
        
        <!-- <tbody>: Groups the main body data (the actual student marks) -->
        <tbody>
            <tr>
                <!-- <td>: Defines a standard data cell -->
                <td>101</td>
                <td>Alice Smith</td>
                <td>85</td>
                <td>92</td>
                <td>88</td>
                <td>265</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Bob Jones</td>
                <td>78</td>
                <td>80</td>
                <td>82</td>
                <td>240</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Charlie Brown</td>
                <td>95</td>
                <td>89</td>
                <td>91</td>
                <td>275</td>
            </tr>
        </tbody>
        
        <!-- <tfoot>: Groups footer content (ideal for summaries, averages, or totals) -->
        <tfoot>
            <tr>
                <!-- colspan="2" combines the first two cells so the text aligns nicely -->
                <td colspan="2">Class Average</td>
                <td>86.0</td>
                <td>87.0</td>
                <td>87.0</td>
                <td>260.0</td>
            </tr>
        </tfoot>

    </table>

</body>
</html>
